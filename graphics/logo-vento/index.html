<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <title>Zephyr · logo Vento</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        body { font-family: Inter, sans-serif; max-width: 1400px; margin: 40px auto; padding: 0 24px; color: #18181b; }
        h1 { font-size: 32px; }
        h2 { font-size: 20px; margin-top: 40px; }
        p { color: #52525b; }
        .logos { display: flex; gap: 24px; align-items: center; margin: 16px 0; }
        .logos img { height: 56px; }
        .dk { background: #18181b; padding: 16px 24px; border-radius: 12px; }
        .icons { display: flex; gap: 32px; align-items: flex-end; }
        .icons figure { margin: 0; text-align: center; font-size: 13px; color: #71717a; }
        .icons img { display: block; margin: 0 auto 8px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .grid img { width: 100%; border: 1px solid #e4e4e7; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>Zephyr · logo Vento</h1>
    <p>Una Z con due tratti tenui ai lati: il movimento dello zefiro. Wordmark minuscolo in Inter Display SemiBold, palette navy <code>#0f2a3d</code> e azzurro <code>#5cc8f5</code>.</p>

    <h2>Logo</h2>
    <div class="logos">
        <img src="logo.svg" alt="Logo su sfondo chiaro">
        <span class="dk"><img src="logo-dark.svg" alt="Logo su sfondo scuro"></span>
    </div>

    <h2>Favicon</h2>
    <div class="icons">
        <figure><img src="favicon.svg" width="120" alt="">SVG</figure>
        <figure><img src="favicon-180.png" width="90" alt="">180 px</figure>
        <figure><img src="favicon-32.png" width="32" alt="">32 px</figure>
        <figure><img src="favicon-16.png" width="16" alt="">16 px</figure>
    </div>

    <h2>Mockup</h2>
    <div class="grid">
        <a href="mockup-panel-chiaro.png"><img src="mockup-panel-chiaro.png" alt="Pannello, tema chiaro"></a>
        <a href="mockup-panel-scuro.png"><img src="mockup-panel-scuro.png" alt="Pannello, tema scuro"></a>
        <a href="mockup-login-chiaro.png"><img src="mockup-login-chiaro.png" alt="Login, tema chiaro"></a>
        <a href="mockup-login-scuro.png"><img src="mockup-login-scuro.png" alt="Login, tema scuro"></a>
        <a href="mockup-favicon.png"><img src="mockup-favicon.png" alt="Favicon nelle schede del browser"></a>
    </div>
</body>
</html>
