name: Tests

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  version-alignment:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify app.php version matches Git tag
        run: |
          set -euo pipefail
          version_pattern="^\\\$appVersion = [\"'][^\"']+[\"'];"
          if ! grep -Eq "$version_pattern" config/app.php; then
            echo 'Hardcoded $appVersion not found in config/app.php'
            exit 1
          fi

          app_ver="$(grep -E "$version_pattern" config/app.php | head -n1 | sed -E "s/^\\\$appVersion = [\"']([^\"']+)[\"'];/\\1/")"
          tag_ver="${GITHUB_REF_NAME}"
          app_norm="${app_ver#v}"
          tag_norm="${tag_ver#v}"

          echo "APP_VERSION=${app_ver}"
          echo "TAG=${tag_ver}"

          if [ "${app_norm}" != "${tag_norm}" ]; then
            echo "Version mismatch: app.php (${app_ver}) != tag (${tag_ver})"
            exit 1
          fi

  pint:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Check code style
        run: vendor/bin/pint --test

  pest:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Copy environment
        run: cp .env.example .env

      - name: Install Node dependencies
        run: npm ci

      # Must run before `composer install`, whose post-autoload-dump script
      # (`filament:upgrade`) publishes the compiled barcode-scanner Alpine
      # component registered in AppServiceProvider.
      - name: Build frontend assets
        run: npm run build

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Generate app key
        run: php artisan key:generate

      - name: Run tests
        run: php artisan test
